<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ebd9">
  <title>Ribbit</title>
  <!-- Installable: Add to Home Screen opens it full screen, without the browser bars (manifest for Android/Chrome,
       the apple-* tags for iPhone). sw.js keeps a copy so it opens offline. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ribbit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-home"><!-- the app opens on Home (no fade on load) -->
  <!-- The main area: tap right = +1, tap left = −1, swipe down = Enter, swipe up = Reset (handled in app.js). -->
  <button id="increment" type="button" aria-label="Counter. Tap right to add one, left to remove one, swipe down to enter, swipe up to reset.">
    <output id="count" aria-live="polite">0</output>
  </button>

  <!-- Filled by app.js with one row of dots per Enter. Shows the last 3 rows; dragging up enters history mode, swiping sideways scrolls long rows. -->
  <div class="dots" id="dots" role="img" aria-label="No entries yet"><div class="dots__scroller" id="dot-scroller"><div class="dots__rows" id="dot-rows"></div></div></div>

  <!-- Selection (long-press a row): a cream card behind the selected squares, drawn over the strip; drag its grips to
       include or exclude squares (sides) and rows (top, bottom). Filled and positioned by app.js. -->
  <div class="row-editor" id="row-editor" hidden>
    <div class="row-editor__stage">
      <div class="row-editor__card" id="row-editor-card"></div>
      <div id="row-editor-squares"></div>
      <span class="row-editor__grip row-editor__grip--left" data-side="left" aria-hidden="true"></span>
      <span class="row-editor__grip row-editor__grip--right" data-side="right" aria-hidden="true"></span>
      <span class="row-editor__grip row-editor__grip--top" data-side="top" aria-hidden="true"></span>
      <span class="row-editor__grip row-editor__grip--bottom" data-side="bottom" aria-hidden="true"></span>
    </div>
  </div>

  <!-- Only shown in history mode (kept in the layout so app.js can measure where the open strip stops). -->
  <!-- Floating pills (default view): back to Home (top left), a solid circle in the dot colour (top right, opens the colour picker), and the
       current project's title (top centre, tap to rename). -->
  <button class="pill pill--round" id="back" type="button" aria-label="Home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </button>
  <button class="pill pill--dot" id="color-open" type="button" aria-label="Dot colour" aria-expanded="false" aria-controls="color-picker"></button>
  <button class="pill pill--title" id="rename-open" type="button" aria-label="Rename project"><span id="project-title"></span></button>

  <div class="bar bar--history">
    <button class="icon-button-small" id="done" type="button" aria-label="Close history">
      <img src="icons/x.svg" width="24" height="24" alt="">
    </button>
  </div>

  <!-- Shown while a row is selected (long-press a row). -->
  <div class="bar bar--select">
    <button class="chip" id="cancel-select" type="button">Cancel</button>
    <button class="chip chip--danger" id="delete-row" type="button">Delete</button>
  </div>

  <!-- Colour picker (tap the dot-colour circle): a saturation/brightness gradient panel, a hue strip and swatches of
       the colours already used in this project. Picks are saved straight away; tap outside, the circle again, or
       Esc to close. -->
  <div class="picker" id="color-picker" role="dialog" aria-label="Dot colour">
    <div class="picker__backdrop" id="picker-backdrop"></div>
    <div class="picker__card">
      <div class="picker__sv" id="picker-sv" role="slider" tabindex="0" aria-label="Saturation and brightness">
        <div class="picker__thumb" id="picker-sv-thumb"></div>
      </div>
      <div class="picker__hue" id="picker-hue" role="slider" tabindex="0" aria-label="Hue" aria-valuemin="0" aria-valuemax="360">
        <div class="picker__thumb" id="picker-hue-thumb"></div>
      </div>
      <!-- One swatch per colour used in this project's rows (filled by app.js; hidden when there are none). -->
      <div class="picker__used" id="picker-used">
        <p class="picker__label" id="picker-used-label">In this project:</p>
        <div class="picker__swatches" id="picker-swatches" role="group" aria-labelledby="picker-used-label"></div>
      </div>
    </div>
  </div>

  <!-- Rename (tap the title pill): the question and the name field sit right above the keyboard. The round
       button cancels (×) until something is typed, then confirms (✓). -->
  <form class="rename" id="rename" autocomplete="off">
    <div class="rename__panel">
      <h2 class="rename__question" id="rename-question">What shall we call this?</h2>
      <div class="rename__row">
        <input class="rename__input" id="rename-input" type="text" maxlength="40" enterkeyhint="done"
          autocapitalize="sentences" spellcheck="false" aria-labelledby="rename-question">
        <button class="icon-button-small" id="rename-action" type="button" aria-label="Cancel">
          <img class="icon-x" src="icons/x.svg" width="24" height="24" alt="">
          <img class="icon-check" src="icons/check.svg" width="24" height="24" alt="">
        </button>
      </div>
    </div>
  </form>

  <!-- Home (what the app opens on): a loose pile of project balls above the + button. Tap a ball to open that
       project's counter, long-press it to delete; + starts a new project. Pile is rendered by app.js. -->
  <section class="home" id="home" aria-label="Projects">
    <h1 class="home__title">Ribbit</h1>
    <div class="home__main">
      <div class="home__pile" id="home-pile"><ul class="home__balls" id="projects-list"></ul></div>
      <button class="icon-button home__new" id="new-project" type="button" aria-label="New project">
        <img src="icons/plus.svg" width="56" height="56" alt="">
      </button>
    </div>
    <!-- Backup menu (top right): save all projects to a file, or load them back from one. -->
    <button class="icon-button-small home__more" id="home-more" type="button" aria-label="Backup" aria-expanded="false" aria-controls="home-menu">
      <img src="icons/more.svg" width="24" height="24" alt="">
    </button>
    <div class="home__menu" id="home-menu">
      <div class="home__menu-backdrop" id="home-menu-backdrop"></div>
      <div class="home__menu-card" role="group" aria-label="Backup">
        <button class="chip" id="backup" type="button">Back up projects</button>
        <button class="chip" id="restore" type="button">Restore a backup</button>
        <p class="home__menu-note" id="backup-note" aria-live="polite"></p>
        <input id="restore-file" type="file" accept=".json,application/json" hidden>
      </div>
    </div>
    <!-- Shown while a ball is selected (long-press). -->
    <div class="bar home__select">
      <button class="chip" id="cancel-project" type="button">Cancel</button>
      <button class="chip chip--danger" id="delete-project" type="button">Delete</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
