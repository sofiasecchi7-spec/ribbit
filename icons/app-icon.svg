<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon (source for icons/icon-*.png): a chunky green frog sitting up, with an R of red yarn on its belly
       whose loose end runs down to a ball of yarn by its feet. Every part is drawn like the + button: green face
       over a dark green rim that shows more at the bottom. On Home's parchment-to-blue background. Full bleed and
       everything inside the central 80% circle, so it also works as a maskable icon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7fa8c9" stop-opacity="0.55"/>
      <stop offset="0.155" stop-color="#7fa8c9" stop-opacity="0.309"/>
      <stop offset="0.31" stop-color="#7fa8c9" stop-opacity="0.1375"/>
      <stop offset="0.465" stop-color="#7fa8c9" stop-opacity="0.034"/>
      <stop offset="0.62" stop-color="#7fa8c9" stop-opacity="0"/>
    </linearGradient>
    <ellipse id="body" cx="512" cy="620" rx="225" ry="215"/>
    <g id="legs">
      <ellipse cx="318" cy="730" rx="105" ry="118"/>
      <ellipse cx="706" cy="730" rx="105" ry="118"/>
    </g>
    <g id="feet">
      <ellipse cx="286" cy="848" rx="118" ry="42"/>
      <ellipse cx="738" cy="848" rx="118" ry="42"/>
    </g>
    <g id="head">
      <ellipse cx="512" cy="340" rx="262" ry="172"/>
      <circle cx="378" cy="196" r="98"/>
      <circle cx="646" cy="196" r="98"/>
    </g>
    <!-- The yarn: an R, its leg running on as a loose strand down to the ball. -->
    <path id="yarn" d="M 452 748 L 452 548 L 518 548 C 606 548 606 650 518 650 L 456 650 M 512 652 L 578 742
                       C 600 772 640 800 672 818"/>
    <!-- Wraps of yarn on the ball. -->
    <pattern id="ply" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <rect width="18" height="18" fill="#c8423a"/>
      <rect width="7" height="18" fill="#e0685c"/>
    </pattern>
    <clipPath id="ball-clip"><circle cx="712" cy="846" r="62"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#f4ebd9"/>
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <g transform="translate(512 518) scale(0.79) translate(-512 -530)">
    <!-- Each part: dark green rim (grown 12, dropped 16), then the green face. Back to front. -->
    <g fill="#2f6b27" stroke="#2f6b27" stroke-width="24" stroke-linejoin="round">
      <use href="#body" transform="translate(0 16)"/>
    </g>
    <use href="#body" fill="#4a9c3e"/>
    <!-- Belly. -->
    <ellipse cx="512" cy="650" rx="160" ry="158" fill="#b9d98a"/>
    <g fill="#2f6b27" stroke="#2f6b27" stroke-width="24" stroke-linejoin="round">
      <use href="#legs" transform="translate(0 16)"/>
    </g>
    <use href="#legs" fill="#4a9c3e"/>
    <g fill="#2f6b27" stroke="#2f6b27" stroke-width="24" stroke-linejoin="round">
      <use href="#feet" transform="translate(0 16)"/>
    </g>
    <use href="#feet" fill="#4a9c3e"/>
    <g fill="#2f6b27" stroke="#2f6b27" stroke-width="24" stroke-linejoin="round">
      <use href="#head" transform="translate(0 16)"/>
    </g>
    <use href="#head" fill="#4a9c3e"/>

    <!-- Eyes: cream whites, brown pupils, a cream glint. -->
    <g fill="#faf4e6">
      <circle cx="378" cy="190" r="62"/>
      <circle cx="646" cy="190" r="62"/>
    </g>
    <g fill="#5c5348">
      <circle cx="390" cy="202" r="32"/>
      <circle cx="634" cy="202" r="32"/>
    </g>
    <g fill="#faf4e6">
      <circle cx="402" cy="188" r="10"/>
      <circle cx="646" cy="188" r="10"/>
    </g>
    <!-- Cheeks and a wide smile. -->
    <g fill="#f4a3a0" opacity="0.85">
      <ellipse cx="326" cy="372" rx="48" ry="30"/>
      <ellipse cx="698" cy="372" rx="48" ry="30"/>
    </g>
    <path d="M 410 372 Q 512 460 614 372" fill="none" stroke="#2f6b27" stroke-width="20" stroke-linecap="round"/>

    <!-- Ball of yarn by the right foot: red, with a darker underside and two sets of wraps crossing. -->
    <circle cx="712" cy="852" r="62" fill="#8f2620"/>
    <circle cx="712" cy="846" r="62" fill="#c8423a"/>
    <g clip-path="url(#ball-clip)" fill="none" stroke-linecap="round">
      <g stroke="#e0685c" stroke-width="8">
        <path d="M 640 820 Q 700 812 744 790"/>
        <path d="M 644 846 Q 710 838 772 806"/>
        <path d="M 652 874 Q 720 866 780 832"/>
      </g>
      <g stroke="#8f2620" stroke-width="6">
        <path d="M 724 780 Q 744 840 732 912"/>
        <path d="M 752 788 Q 770 840 762 900"/>
      </g>
    </g>

    <!-- The yarn strand: dark red underside, red strand, lighter ply bands across it. -->
    <use href="#yarn" transform="translate(0 5)" fill="none" stroke="#8f2620" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#yarn" fill="none" stroke="url(#ply)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
